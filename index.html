<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة النون الساكنة والتنوين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Amiri+Quran&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E7F0EB;--surface:#FFFFFF;--surface2:#F2F8F5;--ink:#12312B;--muted:#56716A;--line:#CFE0D8;
  --emerald:#0E7A5C;--on-emerald:#FFFFFF;--emerald-soft:#D7EFE5;--gold:#B5852A;--gold-soft:#F6EBD3;
  --wrong:#B23A27;--wrong-soft:#F8DED8;--hl:#C2185B;
  --f-quran:"Amiri Quran","Amiri","Traditional Arabic","Geeza Pro",serif;
  --f-head:"Almarai","IBM Plex Sans Arabic","Geeza Pro","Segoe UI",Tahoma,sans-serif;
  --f-ui:"IBM Plex Sans Arabic","Geeza Pro","Segoe UI",Tahoma,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B1E1A;--surface:#12302A;--surface2:#173A33;--ink:#E5F2ED;--muted:#9BB7AE;--line:#2A4F45;
    --emerald:#3CC496;--on-emerald:#062019;--emerald-soft:#173F35;--gold:#E2B456;--gold-soft:#3A3220;
    --wrong:#F27D69;--wrong-soft:#43231E;--hl:#FF73AC;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B1E1A;--surface:#12302A;--surface2:#173A33;--ink:#E5F2ED;--muted:#9BB7AE;--line:#2A4F45;
  --emerald:#3CC496;--on-emerald:#062019;--emerald-soft:#173F35;--gold:#E2B456;--gold-soft:#3A3220;
  --wrong:#F27D69;--wrong-soft:#43231E;--hl:#FF73AC;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:17px;line-height:1.65;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.brand{font-family:var(--f-head);font-weight:700;font-size:1.2rem;color:var(--emerald);background:none;border:0;padding:4px 0}
.top-side{display:flex;gap:6px;align-items:center}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:700;font-size:.9rem;white-space:nowrap}
.chip .s{color:var(--gold)}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:999px;width:38px;height:38px;display:grid;place-items:center;font-size:1.05rem;padding:0}

.hero{text-align:center;padding:14px 0 6px}
.hero h1{font-family:var(--f-head);font-weight:700;font-size:clamp(1.9rem,8.5vw,2.6rem);margin:0;line-height:1.3}
.hero .demo{font-family:var(--f-quran);font-size:3.3rem;line-height:1.8;margin:0}
.hero p{color:var(--muted);margin:6px auto 0;max-width:36ch}
.titleimg img{display:block;width:78%;max-width:500px;height:auto;margin:4px auto 6px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}
.degree{display:flex;justify-content:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.degree .chip{font-size:1rem;padding:6px 14px}
.golden{background:var(--gold-soft);border-inline-start:5px solid var(--gold);border-radius:12px;padding:12px 14px;margin:16px 0;font-weight:500}
.golden b{font-family:var(--f-head);font-weight:700;display:block;color:var(--gold)}
.alert{background:var(--wrong-soft);border-inline-start:5px solid var(--wrong);border-radius:12px;padding:12px 14px;margin:14px 0;font-weight:500;text-align:start}
.alert b{font-family:var(--f-head);font-weight:800;display:block;color:var(--wrong)}
.qw{font-family:var(--f-quran);font-size:1.3em;line-height:1.6}
.m1,.m2,.m3,.m4{font-size:1.5em;font-weight:700;white-space:nowrap}
.m1{color:#0E7A5C}.m2{color:#2D69A8}.m3{color:#6E46A8}.m4{color:#9A6B12}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .m1{color:#3CC496}:root:not([data-theme="light"]) .m2{color:#7FB2F0}:root:not([data-theme="light"]) .m3{color:#C3A2F2}:root:not([data-theme="light"]) .m4{color:#E2B456}}
:root[data-theme="dark"] .m1{color:#3CC496}:root[data-theme="dark"] .m2{color:#7FB2F0}:root[data-theme="dark"] .m3{color:#C3A2F2}:root[data-theme="dark"] .m4{color:#E2B456}

.jtitle{font-family:var(--f-head);font-size:1.3rem;margin:24px 0 4px}
.jsub{color:var(--muted);margin:0 0 10px;font-size:.95rem}
.path{display:flex;flex-direction:column;gap:12px}
.node{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:start;width:100%}
.node[disabled]{opacity:.5;cursor:not-allowed}
.node.final{border:2px solid var(--gold);background:var(--gold-soft)}
.node .info{flex:1;min-width:0}
.node .t{font-family:var(--f-head);font-weight:700;font-size:1.15rem;display:block}
.node .g{color:var(--muted);font-size:.9rem;display:block}
.node .sc{font-size:.85rem;color:var(--muted);display:block}
.badge{position:relative;width:54px;height:54px;flex:none;display:grid;place-items:center;font-family:var(--f-head);font-weight:700;font-size:1.3rem;color:#fff}
.badge::before,.badge::after{content:"";position:absolute;inset:8px;background:var(--c);border-radius:5px}
.badge::after{transform:rotate(45deg)}
.badge span{position:relative;z-index:1}
.stars{letter-spacing:2px;font-size:1.05rem;white-space:nowrap}
.stars .on{color:var(--gold)}
.stars .off{color:var(--line)}
.lock{font-size:1.2rem}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 18px}
.intro{text-align:center}
.intro .badge{margin:0 auto 6px;width:72px;height:72px;font-size:1.8rem}
.intro .badge::before,.intro .badge::after{inset:11px}
.intro h2{font-family:var(--f-head);font-size:1.7rem;margin:4px 0}
.intro .goal{color:var(--muted);margin:0 0 14px}
.intro .golden{text-align:start}
.meta{color:var(--muted);font-size:.95rem}

.primary{display:block;width:100%;background:var(--emerald);color:var(--on-emerald);border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:1.08rem;margin-top:12px}
.primary:disabled{opacity:.45;cursor:not-allowed}
.secondary{display:block;width:100%;background:transparent;color:var(--emerald);border:2px solid var(--emerald);border-radius:14px;padding:12px 18px;font-weight:700;font-size:1.02rem;margin-top:10px}
.ghost{background:none;border:0;color:var(--muted);text-decoration:underline;margin-top:10px;width:100%;padding:8px}

.playhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.playhead .st{font-family:var(--f-head);font-weight:700}
.streak{background:var(--gold-soft);color:var(--gold);border-radius:999px;padding:2px 10px;font-weight:700;font-size:.92rem}
.progress{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.progress i{height:8px;border-radius:4px;background:var(--line)}
.progress i.ok{background:var(--emerald)}
.progress i.no{background:var(--wrong)}
.progress i.cur,.progress i.done{background:var(--gold)}
.timer{height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--gold);transform-origin:right;animation:shrink linear forwards}
.timer-note{font-size:.8rem;color:var(--muted);margin-top:2px}
.qtext{font-weight:700;font-size:1.12rem;margin:16px 0 6px}
.frame{position:relative;background:var(--surface);border:2px solid var(--gold);border-radius:6px;outline:1px solid var(--gold);outline-offset:5px;margin:16px 8px 22px;padding:16px 12px;text-align:center}
.frame::before,.frame::after{content:"";position:absolute;top:50%;width:12px;height:12px;background:var(--gold);transform:translateY(-50%) rotate(45deg)}
.frame::before{right:-9px}
.frame::after{left:-9px}
.word{font-family:var(--f-quran);font-size:clamp(1.9rem,9vw,2.9rem);line-height:2.1;word-spacing:.1em}
.hl{color:var(--hl);text-shadow:0 0 18px color-mix(in srgb,var(--hl) 35%,transparent)}
.statement{background:var(--surface2);border:1px dashed var(--gold);border-radius:12px;padding:10px 14px;font-weight:700;margin:0 0 14px}
.opts{display:grid;gap:10px}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:13px 16px;text-align:start;font-weight:500;font-size:1.06rem;min-height:54px;transition:border-color .15s,background .15s}
.opt.optw{font-family:var(--f-quran);font-size:1.6rem;line-height:1.9;padding:6px 16px;text-align:center;font-weight:400}
.opts.two{grid-template-columns:1fr 1fr}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--emerald);background:var(--emerald-soft)}
.opt.picked-wrong{border-color:var(--wrong);background:var(--wrong-soft);animation:shake .42s}
.opt.right.picked{animation:pop .35s}
.opt.chosen{border-color:var(--gold);background:var(--gold-soft)}

.tapwrap{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.tok{font-family:var(--f-quran);font-size:1.7rem;line-height:1.8;background:var(--surface2);border:2px solid var(--line);border-radius:12px;padding:2px 12px}
.tok[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.tok.right{border-color:var(--emerald);background:var(--emerald-soft)}
.tok.missed{border:2px dashed var(--emerald)}
.tok.picked-wrong{border-color:var(--wrong);background:var(--wrong-soft)}

.bkrow{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 10px;margin-bottom:10px}
.bkrow .w{font-family:var(--f-quran);font-size:1.7rem;line-height:1.9;text-align:center}
.bkopts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bkopts button{border:2px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 2px;font-size:.92rem;font-weight:700}
.bkopts button[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.bkopts button.right{border-color:var(--emerald);background:var(--emerald-soft)}
.bkopts button.picked-wrong{border-color:var(--wrong);background:var(--wrong-soft)}

.feedback{margin-top:14px;padding:14px 16px;border-radius:14px;border-inline-start:6px solid;animation:rise .25s ease-out}
.feedback.good{background:var(--emerald-soft);border-color:var(--emerald)}
.feedback.bad{background:var(--wrong-soft);border-color:var(--wrong)}
.feedback.neutral{background:var(--gold-soft);border-color:var(--gold)}
.fb-title{font-family:var(--f-head);font-weight:700;font-size:1.2rem;display:block}
.fb-pts{color:var(--gold);font-weight:700}

.result{text-align:center}
.bigstars{font-size:3rem;letter-spacing:6px;line-height:1.3}
.bigstars span{display:inline-block}
.bigstars .on{color:var(--gold);animation:starin .5s both}
.bigstars .on:nth-child(2){animation-delay:.25s}
.bigstars .on:nth-child(3){animation-delay:.5s}
.bigstars .off{color:var(--line)}
.score{font-family:var(--f-head);font-size:2.4rem;font-weight:700;margin:4px 0 0}
.result .msg{font-weight:500;margin:6px 0 4px}
.review{text-align:start;margin-top:20px}
.review h3{font-family:var(--f-head);font-size:1.15rem;margin:0 0 8px}
.rv{border-top:1px solid var(--line);padding:12px 0}
.rv .w{font-family:var(--f-quran);font-size:1.6rem;line-height:1.9}
.rv .q{font-weight:700}
.rv .yours{color:var(--wrong)}
.rv .correct{color:var(--emerald);font-weight:700}
.rv .e{color:var(--muted);font-size:.95rem}

.namebox input{width:100%;font:inherit;font-size:1.15rem;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface2);color:var(--ink);margin-top:10px}
.err{color:var(--wrong);font-weight:700;margin:8px 0 0}

.cert{background:var(--surface);border:4px double var(--gold);border-radius:8px;padding:28px 18px;text-align:center;outline:1px solid var(--gold);outline-offset:6px;margin:8px}
.cert.gold{background:linear-gradient(160deg,var(--gold-soft),var(--surface) 60%);border-width:6px}
.cert .school{color:var(--muted);font-size:.92rem}
.cert h2{font-family:var(--f-head);font-size:2rem;color:var(--gold);margin:6px 0}
.cert .who{font-family:var(--f-head);font-size:1.9rem;font-weight:700;color:var(--emerald);margin:8px 0}
.cert .date{color:var(--muted);font-size:.9rem;margin-top:10px}
.foot{text-align:center;margin-top:28px}

#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes starin{from{opacity:0;transform:scale(.3) rotate(-40deg)}to{opacity:1;transform:none}}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap" id="app"></div>
<script>
(function(){
const ar=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const plain=w=>w.replace(/[\[\]]/g,"");

const sample=(a,n)=>shuffle(a.slice()).slice(0,n);
const rnd=a=>a[Math.floor(Math.random()*a.length)];

const KEY="nun-journey-v1";
function fresh(){return {name:"",stages:[],seen:[],sound:true,teacher:false};}
let data=fresh();
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.stages)data=Object.assign(data,s);}catch(e){}
while(data.stages.length<11)data.stages.push({});

function save(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}}
const st=s=>data.stages[s]||{};
const starsOf=s=>st(s).stars||0;
const bestOf=s=>st(s).best||0;
const passed=s=>s===HASM?bestOf(s)>=100:starsOf(s)>0;
const deg100=()=>{let t=0;for(let s=0;s<10;s++)t+=bestOf(s);return t;};
const fmt=n=>ar(Number.isInteger(n)?n:n.toFixed(1)).replace(".","٫");
const chipText=()=>st(HASM).tried?`🏆 ${fmt(bestOf(HASM))} / ${ar(100)}`:`${ar(deg100())} / ${ar(100)}`;
const distinct=()=>(st(HASM).speed||0)>=SPEEDOK;
const totalStars=()=>{let t=0;for(let s=0;s<10;s++)t+=starsOf(s);return t;};
function unlocked(s){
  if(data.teacher||s===0)return true;
  if(s===HASM)return passed(9)&&deg100()>=GATE;
  return passed(s-1);
}

function pickPool(s){
  const pool=STAGES[s].pool,seen=new Set(data.seen[s]||[]);
  let chosen=shuffle(pool.filter(q=>!seen.has(q.id))).slice(0,N);
  if(chosen.length<N){
    const rest=shuffle(pool.filter(q=>!chosen.includes(q)));
    chosen=chosen.concat(rest.slice(0,N-chosen.length));
    data.seen[s]=chosen.map(q=>q.id);
  }else data.seen[s]=[...seen,...chosen.map(q=>q.id)];
  save();return shuffle(chosen);
}
function build(s){
  const raw=STAGES[s].pool?pickPool(s):STAGES[s].gen();
  return raw.map(q=>{const c=Object.assign({},q);if(c.k==="mc")c.opts=shuffle(c.o.slice());return c;});
}

function confetti(gold){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  cv.width=innerWidth;cv.height=innerHeight;
  const cols=gold?["#E2B456","#B5852A","#F6EBD3","#FFD86B"]:["#E2B456","#0E7A5C","#C2185B","#2D69A8","#6E46A8"];
  const ps=Array.from({length:gold?200:130},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3.5,r:Math.random()*6.28,vr:(Math.random()-.5)*.25,s:6+Math.random()*7,c:cols[Math.floor(Math.random()*cols.length)]}));
  const end=performance.now()+(gold?4000:2800);
  (function f(now){
    cx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore();});
    if(now<end)requestAnimationFrame(f);else cx.clearRect(0,0,cv.width,cv.height);
  })(performance.now());
}

function intro(s){
  const m=STAGES[s];
  const need=s===HASM?`${ar(N)} أسئلة من كل الأنواع، لكل سؤال ${ar(10)} درجات، ومجموعها ${ar(100)}. ولا تجتاز الحسم إلا بالدرجة الكاملة.`:`${ar(N)} أسئلة، وتحتاج ${ar(PASS)} إجابات صحيحة لتفتح المرحلة التالية.`;
  show(`<div class="card intro"><span class="badge" style="--c:${m.c}"><span>${s===HASM?"★":ar(s+1)}</span></span>
  <h2>${m.t}</h2><p class="goal">${m.g}</p>
  ${m.alert?ALERT_HTML:""}<div class="golden"><b>تلميح قبل البدء</b>${m.tip}</div>
  <p class="meta">${need}${m.timer?" نقاطك تُحسب بسرعتك: كلما أجبت إجابة صحيحة أسرع زادت نقاطك. أما درجتك فتُحسب بالصواب والخطأ فقط.":""}${bestOf(s)?" عند الإعادة تظهر لك أمثلة جديدة.":""}</p>
  <button class="primary" data-act="start" data-s="${s}">ابدأ المرحلة</button>
  <button class="secondary" data-act="home">العودة إلى الخريطة</button></div>`);
}

function start(s){G={s,qs:build(s),i:0,correct:0,fast:0,streak:0,points:0,log:[],answered:false};play();}
const isHasm=()=>G.s===HASM;
const limitOf=q=>{const hz=G&&G.s===HASM;return q.k==="mc"?(hz?20:15):(hz?40:35);};

function play(){
  const q=G.qs[G.i],m=STAGES[G.s];
  let bar="";for(let k=0;k<N;k++){const l=G.log[k];bar+=`<i class="${l?(isHasm()?"done":(l.ok?"ok":"no")):(k===G.i?"cur":"")}"></i>`;}
  let body=`<p class="qtext">${q.q}</p>`;
  if(q.k==="mc"){
    if(q.w)body+=`<div class="frame"><div class="word">${hl(q.w)}</div></div>`;
    if(q.st)body+=`<p class="statement">${q.st}</p>`;
    body+=`<div class="opts${q.two?" two":""}">${q.opts.map((o,i)=>`<button class="opt${q.ow?" optw":""}" data-act="opt" data-i="${i}">${q.ow?hl(o):o}</button>`).join("")}</div>`;
  }else if(q.k==="tap"){
    G.sel=new Set();
    body+=`<div class="frame"><div class="tapwrap">${q.tokens.map((t,i)=>`<button class="tok" data-act="tok" data-i="${i}" aria-pressed="false">${t.t}</button>`).join("")}</div></div>
    <button class="primary" data-act="check">تحقّق</button>`;
  }else{
    G.bk=q.items.map(()=>-1);
    body+=q.items.map((b,r)=>`<div class="bkrow"><div class="w">${hl(b.w)}</div><div class="bkopts">${R.map((x,j)=>`<button data-act="bk" data-r="${r}" data-j="${j}" aria-pressed="false">${x}</button>`).join("")}</div></div>`).join("")
    +`<button class="primary" data-act="check" disabled>تحقّق</button>`;
  }
  show(`<div class="playhead"><span class="st">${m.t}</span>
    ${G.streak>=3&&!isHasm()?`<span class="streak">🔥 ${ar(G.streak)} متتالية</span>`:`<span class="meta">السؤال ${ar(G.i+1)} من ${ar(N)}</span>`}</div>
  <div class="progress" aria-hidden="true">${bar}</div>
  ${m.timer?`<div class="timer" aria-hidden="true"><i id="tbar" style="animation-duration:${limitOf(q)}s"></i></div>`:""}
  ${body}<div id="fb" aria-live="polite"></div>`);
  G.answered=false;G.t0=performance.now();
}

const GOOD=["أحسنت!","بارك الله فيك!","إجابة متقنة!","ممتاز، واصل!","ما شاء الله!"];
const BAD=["لا بأس، تعلّم منها","قريب! انظر التوضيح","ركّز في الحرف الملوّن"];

function judge(ok,pickText,correctText,frac){
  if(frac===undefined)frac=ok?1:0;
  G.score=(G.score||0)+10*frac;
  G.answered=true;
  const q=G.qs[G.i],m=STAGES[G.s];
  const tb=document.getElementById("tbar");if(tb)tb.style.animationPlayState="paused";
  const el=(performance.now()-G.t0)/1000,lim=limitOf(q),fast=m.timer&&el<=lim;
  let pts=0;
  if(ok){G.correct++;G.streak++;pts=fast?5+Math.round(5*(1-el/lim)):2;if(fast)G.fast++;G.points+=pts;}
  else G.streak=0;
  G.log[G.i]={ok,q,pick:pickText,correct:correctText};
  const last=G.i===N-1,nextBtn=`<button class="primary" data-act="next">${last?"اعرض النتيجة":"السؤال التالي"}</button>`;
  const fb=document.getElementById("fb");
  if(isHasm()){
    sfx.tick();
    fb.innerHTML=`<div class="feedback neutral"><span class="fb-title">حُفظت إجابتك</span>تظهر النتيجة والتصحيح في نهاية الحسم.</div>`+nextBtn;
  }else{
    ok?(G.streak>=3?sfx.streak():sfx.ok()):sfx.bad();
    fb.innerHTML=`<div class="feedback ${ok?"good":"bad"}">
      <span class="fb-title">${ok?(G.streak>=3?"🔥 سلسلة صحيحة! ":"")+rnd(GOOD):rnd(BAD)} ${ok?`<span class="fb-pts">+${ar(pts)}${fast?" ⚡":""}</span>`:""}</span>
      ${ok?"":`الصواب: <b>${correctText}</b><br>`}${q.e}</div>`+nextBtn;
  }
  const nb=app.querySelector('[data-act="next"]');if(nb)nb.focus({preventScroll:true});
  fb.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"nearest"});
}

function answerMC(i){
  if(G.answered)return;
  const q=G.qs[G.i],pick=q.opts[i],ok=pick===q.o[0];
  const btns=[...app.querySelectorAll(".opt")];
  btns.forEach((b,k)=>{b.disabled=true;if(!isHasm()&&q.opts[k]===q.o[0])b.classList.add("right");});
  btns[i].classList.add(isHasm()?"chosen":(ok?"picked":"picked-wrong"));
  const show_=x=>q.ow?plain(x):x;
  judge(ok,show_(pick),show_(q.o[0]));
}
function checkTap(){
  const q=G.qs[G.i];
  const ok=q.tokens.every((t,i)=>t.target===G.sel.has(i));
  const T=q.tokens.filter(t=>t.target).length,hits=q.tokens.filter((t,i)=>t.target&&G.sel.has(i)).length,fp=q.tokens.filter((t,i)=>!t.target&&G.sel.has(i)).length;
  const frac=T?Math.max(0,(hits-fp)/T):(ok?1:0);
  app.querySelectorAll(".tok").forEach((b,i)=>{b.disabled=true;
    if(isHasm())return;
    const t=q.tokens[i],s=G.sel.has(i);
    if(t.target&&s)b.classList.add("right");else if(t.target)b.classList.add("missed");else if(s)b.classList.add("picked-wrong");});
  app.querySelector('[data-act="check"]').remove();
  const chosen=[...G.sel].sort((a,b)=>a-b).map(i=>q.tokens[i].t);
  judge(ok,chosen.length?chosen.join("، "):"لم تختر شيئًا",q.tokens.filter(t=>t.target).map(t=>t.t).join("، "),frac);
}
function checkBk(){
  const q=G.qs[G.i];
  const ok=q.items.every((b,r)=>G.bk[r]===b.a),frac=q.items.filter((b,r)=>G.bk[r]===b.a).length/q.items.length;
  app.querySelectorAll(".bkopts button").forEach(b=>{b.disabled=true;
    if(isHasm())return;
    const r=+b.dataset.r,j=+b.dataset.j;
    if(q.items[r].a===j)b.classList.add("right");else if(G.bk[r]===j)b.classList.add("picked-wrong");});
  app.querySelector('[data-act="check"]').remove();
  judge(ok,q.items.map((b,r)=>plain(b.w)+": "+R[G.bk[r]]).join("، "),q.items.map(b=>plain(b.w)+": "+R[b.a]).join("، "),frac);
}

function next(){if(G.i<N-1){G.i++;play();}else result();}

function result(){
  const s=G.s,c=G.correct,hasm=isHasm();
  const stars=c>=10?3:c>=9?2:c>=PASS?1:0;
  const prev=st(s),wasPassed=passed(s);
  const score=Math.round((G.score||0)*10)/10,won=hasm?c>=HPASS:stars>0,speed=Math.round(G.fast/N*100);
  data.stages[s]={tried:hasm||prev.tried,stars:Math.max(prev.stars||0,stars),best:Math.max(prev.best||0,hasm?score:c),points:Math.max(prev.points||0,G.points),speed:Math.max(prev.speed||0,hasm&&won?speed:0)};
  save();
  let msg,h;
  if(hasm){
    msg=won?(speed>=SPEEDOK?"ما شاء الله، تبارك الرحمن! اجتزت الحسم بإتقان وسرعة، ونلت شهادة الإبداع والامتياز.":"مبارك! اجتزت الحسم ونلت شهادة الشكر والثناء. ارفع سرعتك إلى "+ar(SPEEDOK)+"٪ لتنال شهادة الإبداع والامتياز."):"درجتك "+fmt(score)+" من "+ar(100)+"، ولا تجتاز الحسم إلا بالدرجة الكاملة "+ar(100)+". راجع أخطاءك، ثم أعد المحاولة بأسئلة جديدة.";
    h=`<div class="card result"><div class="bigstars">${won?"🏆":"⏳"}</div>`;
  }else{
    msg=stars===3?"إتقان كامل! ما شاء الله، تبارك الرحمن.":stars===2?"رائع! اقتربت من العلامة الكاملة.":stars===1?"اجتزت المرحلة! أعدها لترفع درجتك، وستظهر لك أمثلة جديدة.":"تحتاج "+ar(PASS)+" إجابات صحيحة لتفتح المرحلة التالية. أعد المحاولة، وستظهر لك أمثلة جديدة.";
    h=`<div class="card result"><div class="bigstars" aria-label="${ar(stars)} من ٣ نجوم">${starRow(stars)}</div>`;
  }
  if(hasm)h+=`<p class="score">${fmt(score)} / ${ar(100)}</p><p class="meta" style="margin:0">أسئلة كاملة الصواب: ${ar(c)} من ${ar(N)} · سرعتك: ${ar(speed)}٪ · النقاط: ${ar(G.points)}<br>درجة الترشح من الرحلتين: ${ar(deg100())} من ${ar(100)}</p><p class="meta" style="margin:4px 0 0">السرعة: نسبة الأسئلة التي أجبت عنها إجابة صحيحة قبل انتهاء الشريط الذهبي.</p><p class="msg">${msg}</p>`;
  else h+=`<p class="score">${ar(c)} / ${ar(N)}</p><p class="meta" style="margin:0">النقاط: ${ar(G.points)} · درجة الترشح: ${ar(deg100())} من ${ar(100)}</p><p class="msg">${msg}</p>`;
  if(hasm&&won)h+=`<button class="primary" data-act="cert" data-k="gold">${distinct()?"استلم شهادة الإبداع والامتياز 🏆":"استلم شهادة الشكر والثناء 🎖️"}</button>`;
  else if(s===4&&won&&!wasPassed)h+=`<button class="primary" data-act="cert" data-k="silver">استلم شهادة الرحلة الأولى 🏅</button>`;
  else if(won&&s<9)h+=`<button class="primary" data-act="stage" data-s="${s+1}">المرحلة التالية: ${STAGES[s+1].t}</button>`;
  else if(won&&s===9){
    if(unlocked(HASM))h+=`<button class="primary" data-act="stage" data-s="${HASM}">ادخل مرحلة الحسم</button>`;
    else h+=`<p class="golden" style="text-align:start"><b>بقي القليل</b>مجموعك في الرحلتين ${ar(deg100())} من ${ar(100)}، وتحتاج ${ar(GATE)} لدخول الحسم. أعد المراحل التي نقصت فيها درجتك، وتُحسب لك أعلى درجة في كل مرحلة.</p>`;
  }
  h+=`<button class="${won?"secondary":"primary"}" data-act="start" data-s="${s}">${hasm&&won&&!distinct()?"أعد الحسم لتنال شهادة الامتياز ⚡":hasm?"أعد الحسم بأسئلة جديدة":"أعد المرحلة بأسئلة جديدة"}</button>
  <button class="ghost" data-act="home">العودة إلى الخريطة</button>`;
  const wrong=G.log.filter(l=>!l.ok);
  if(wrong.length){
    h+=`<div class="review"><h3>راجع أخطاءك</h3>`+wrong.map(l=>`<div class="rv"><div class="q">${l.q.q}</div>
      ${l.q.w?`<div class="w">${hl(l.q.w)}</div>`:""}${l.q.st?`<div>${l.q.st}</div>`:""}
      <div>إجابتك: <span class="yours">${l.pick}</span></div>
      <div>الصواب: <span class="correct">${l.correct}</span></div><div class="e">${l.q.e}</div></div>`).join("")+`</div>`;
  }
  h+=`</div>`;
  show(h);
  if(won){sfx.win();confetti(hasm);}else sfx.bad();
}

function hijri(){try{return new Date().toLocaleDateString("ar-SA-u-ca-islamic-umalqura",{year:"numeric",month:"long",day:"numeric"});}catch(e){return "";}}
function cert(kind){
  if(!data.name){G={pendingCert:kind};return nameScreen();}
  const gold=kind==="gold",top=gold&&distinct(),sp=ar(st(HASM).speed||0);
  let title,body,extra="";
  if(!gold){title="شهادة إتمام";body="بأنه أتمّ مراحل الرحلة الأولى الخمس في درس النون الساكنة والتنوين.";}
  else if(top){title="🏆 شهادة إبداع وامتياز";
    body="بأنه أتمّ رحلة النون الساكنة والتنوين بمراحلها كلها، واجتاز مرحلة الحسم بإتقانٍ وسرعةٍ فائقين، فنال الدرجة الكاملة "+ar(100)+" من "+ar(100)+"، وبلغت سرعته "+sp+"٪. فهنيئًا له هذا التميّز، ونسأل الله أن يجعله من أهل القرآن الذين هم أهل الله وخاصّته.";}
  else{title="🎖️ شهادة شكر وثناء";
    body="بأنه اجتاز جميع مراحل رحلة النون الساكنة والتنوين بنجاح، ونال في مرحلة الحسم الدرجة الكاملة "+ar(100)+" من "+ar(100)+". فجزاه الله خيرًا على جدّه ومثابرته.";
    extra=`<p class="golden" style="text-align:start;margin-top:14px"><b>بقيت لك خطوة واحدة نحو شهادة الإبداع والامتياز</b>سرعتك الآن ${sp}٪، والمطلوب ${ar(SPEEDOK)}٪. المتقن السريع يسبق، فأعد الحسم وأرنا سرعتك!</p>`;}
  show(`<div class="cert${gold?" gold":""}"><div class="school">مدرسة ذي النورين لتحفيظ القرآن الكريم · الصف الأول المتوسط</div>
  <h2>${title}</h2><p style="margin:0">يُشهد للطالب</p>
  <div class="who">${esc(data.name)}</div>
  <p style="margin:0">${body}</p>
  <p class="stars" style="font-size:1.4rem;margin:10px 0 0"><span class="on">★</span> ${ar(totalStars())} نجمة</p>
  <div class="date">${hijri()}</div></div>${extra}
  <p class="meta" style="text-align:center">صوّر الشاشة وأرسل الصورة إلى معلمك.</p>
  ${gold&&!top?`<button class="primary" data-act="start" data-s="${HASM}">أعد الحسم لتنال شهادة الامتياز ⚡</button>`:""}
  <button class="secondary" data-act="home">العودة إلى الخريطة</button>
  <button class="ghost" data-act="editname">تعديل الاسم</button>`);
  confetti(top);sfx.win();
}

app.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  const a=b.dataset.act,s=+b.dataset.s;
  if(a==="home")home();
  else if(a==="stage")intro(s);
  else if(a==="start")start(s);
  else if(a==="opt")answerMC(+b.dataset.i);
  else if(a==="tok"){if(G.answered)return;const i=+b.dataset.i;G.sel.has(i)?G.sel.delete(i):G.sel.add(i);b.setAttribute("aria-pressed",G.sel.has(i));}
  else if(a==="bk"){if(G.answered)return;const r=+b.dataset.r,j=+b.dataset.j;G.bk[r]=j;
    app.querySelectorAll(`.bkopts button[data-r="${r}"]`).forEach(x=>x.setAttribute("aria-pressed",+x.dataset.j===j));
    app.querySelector('[data-act="check"]').disabled=G.bk.includes(-1);}
  else if(a==="check"){if(G.answered)return;G.qs[G.i].k==="tap"?checkTap():checkBk();}
  else if(a==="next")next();
  else if(a==="cert")cert(b.dataset.k);
  else if(a==="theme"){data.theme=isDark()?"light":"dark";save();applyTheme();b.textContent=isDark()?"☀️":"🌙";b.setAttribute("aria-label",isDark()?"الوضع النهاري":"الوضع الليلي");}
  else if(a==="sound"){data.sound=!data.sound;save();b.textContent=data.sound?"🔊":"🔇";b.setAttribute("aria-label",data.sound?"كتم الصوت":"تشغيل الصوت");}
  else if(a==="savename"){const v=(document.getElementById("nm").value||"").trim();data.name=v;data.skipName=!v;save();
    if(G&&G.pendingCert&&v){const k=G.pendingCert;G=null;cert(k);}else home();}
  else if(a==="skipname"){data.skipName=true;save();home();}
  else if(a==="editname")nameScreen();
  else if(a==="teacher")teacherScreen();
  else if(a==="tin"){const v=(document.getElementById("tc").value||"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).trim();
    sha(v).then(x=>{if(x===THASH){data.teacher=true;save();home();}else teacherScreen("الرمز غير صحيح.");});}
  else if(a==="tout"){data.teacher=false;save();home();}
  else if(a==="treset"){const keep=data.teacher;data=fresh();data.teacher=keep;for(let i=0;i<11;i++){data.stages.push({});data.seen.push([]);}save();home();}
});
app.addEventListener("keydown",e=>{
  if(e.key!=="Enter")return;
  if(e.target.id==="nm"){e.preventDefault();app.querySelector('[data-act="savename"]').click();}
  if(e.target.id==="tc"){e.preventDefault();app.querySelector('[data-act="tin"]').click();}
});
function isDark(){return data.theme?data.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;}
function applyTheme(){if(data.theme)document.documentElement.setAttribute("data-theme",data.theme);else document.documentElement.removeAttribute("data-theme");}
applyTheme();
home();
})();
</script>
</body>
</html>
